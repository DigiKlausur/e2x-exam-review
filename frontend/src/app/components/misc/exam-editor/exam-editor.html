<div class="row">
  <div class="col-3">
    <label class="form-label">Semester</label>
    <app-semester-input></app-semester-input>
  </div>
  <div class="col">
    <label class="form-label">Title *</label>
    <input class="form-control" type="text">
  </div>
</div>
<div class="row mt-3">
  <div class="col-2">
    <label class="form-label">Exam Date*</label>
    <app-date-input></app-date-input>
  </div>
  <div class="col-5">
    <label class="form-label">Primary Examiner *</label>
    <app-user-search-input></app-user-search-input>
  </div>
  <div class="col-5">
    <label class="form-label">Secondary Examiner *</label>
    <app-user-search-input></app-user-search-input>
  </div>
</div>
<div class="row mt-3" [(ngbCollapse)]="collapseReviewSettings" #collapse="ngbCollapse">
  <div class="col-2">
    <label class="form-label">Review Start</label>
    <app-date-input></app-date-input>
  </div>
  <div class="col-2">
    <label class="form-label">Review End</label>
    <app-date-input></app-date-input>
  </div>
  <div class="col-auto">
    <div class="form-check form-switch" style="margin-top: 2.5rem">
      <input class="form-check-input" type="checkbox" role="switch" id="showDownloadButtonSwitch">
      <label class="form-check-label" for="showDownloadButtonSwitch">Show Download Button</label>
    </div>
  </div>
  <div class="col-auto">
    <div class="form-check form-switch" style="margin-top: 2.5rem">
      <input class="form-check-input" type="checkbox" role="switch" id="showTextLayerSwitch">
      <label class="form-check-label" for="showTextLayerSwitch">Show Text Layer</label>
    </div>
  </div>
</div>
<div class="d-flex justify-content-center mt-3">
  <a (click)="collapse.toggle()" role="button">@if(collapseReviewSettings) {<i class="bi bi-caret-down-fill"></i> show} @else {<i class="bi bi-caret-up-fill"></i> hide} exam review settings</a>
</div>
<div class="d-flex justify-content-end gap-2">
  <button class="btn btn-secondary"><i class="bi bi-x-lg me-2"></i><span>Abort</span></button>
  <button class="btn btn-primary"><i class="bi bi-floppy me-2"></i><span>Save</span></button>
</div>
