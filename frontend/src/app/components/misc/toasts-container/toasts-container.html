@for (toast of toastService.toasts(); track toast) {
  <ngb-toast
    [class]="toast.classname"
    [autohide]="(toast.delay ?? 10000) > 0"
    [delay]="toast.delay ?? 10000"
    (hidden)="toastService.remove(toast)"
    [header]="toast.header"
  >
    @if(isBodyTemplate(toast)){
      <ng-container [ngTemplateOutlet]="asTemplateRef(toast.body)"></ng-container>
    } @else {
      {{asSignal(toast.body)()}}
    }
  </ngb-toast>
}
