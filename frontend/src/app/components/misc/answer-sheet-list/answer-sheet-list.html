<table class="table">
  <thead>
    <tr>
      <th>Student ID</th>
      <th>Firstname</th>
      <th>Lastname</th>
      <th>File</th>
    </tr>
  </thead>
  <tbody>
    @for (answerSheet of answerSheets; track answerSheet._id){
      <tr>
        <td>{{answerSheet.submitter.studentId}}</td>
        <td>{{answerSheet.submitter.firstname}}</td>
        <td>{{answerSheet.submitter.lastname}}</td>
        <td>{{answerSheet.filePath}}</td>
      </tr>
    } @empty {
      <tr class="disabled">
        <td class="text-center fst-italic" colspan="4">No answer sheets available</td>
      </tr>
    }
  </tbody>
</table>
