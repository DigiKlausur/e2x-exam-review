<ngx-datatable [rows]="exams" [columns]="columns" [sorts]="sorts" [limit]="environment.dataTable.rowsPerPage" [footerHeight]="exams.length > environment.dataTable.footerMinRows ? 55 : 0" [messages]="messages" (activate)="handleActivate($event)" rowHeight="auto" columnMode="flex">

  <ngx-datatable-column name="Semester" i18n-name="@@app.table.header.semester" prop="exam.semester" [flexGrow]="3" [draggable]="false" [resizeable]="false" [pipe]="semesterDisplayNamePipe" />

  <ngx-datatable-column name="Exam Title" i18n-name="@@app.table.header.exam-title" prop="exam.title" [flexGrow]="6" [draggable]="false" [resizeable]="false" />

  <ngx-datatable-column name="Primary Examiner" i18n-name="@@app.table.header.primary-examiner" prop="exam.primaryExaminer" [flexGrow]="4" [draggable]="false" [resizeable]="false" [pipe]="userDisplayNamePipe" />

  <ngx-datatable-column name="Exam Date" i18n-name="@@app.table.header.exam-date" prop="exam.date" [flexGrow]="2" [draggable]="false" [resizeable]="false" [pipe]="datePipe" />

  <ngx-datatable-column name="Review Status" i18n-name="@@app.table.header.review-status" [flexGrow]="2" [draggable]="false" [resizeable]="false" [cellClass]="'d-inline-flex justify-content-end'" >
    <ng-template ngx-datatable-cell-template let-row="row" ><span [class]="getReviewStatusClass(row.exam)">{{examReviewStatusNames[getExamReviewStatus(row.exam)]}}</span></ng-template>
  </ngx-datatable-column>

  <ngx-datatable-footer>
    <ng-template
      ngx-datatable-footer-template
      let-rowCount="rowCount"
      let-pageSize="pageSize"
      let-offset="offset"
    >
      <div class="page-count fst-italic" i18n="@@app.exam.table.footer.stats">showing {{Math.min(rowCount - (offset * pageSize), pageSize)}} of {{rowCount}} {rowCount, plural, =1 {row} other {rows}} ({{Math.ceil(rowCount / pageSize)}} {Math.ceil(rowCount / pageSize), plural, =1 {page} other {pages}})</div>
      <ngx-datatable-pager></ngx-datatable-pager>
    </ng-template>
  </ngx-datatable-footer>
</ngx-datatable>
