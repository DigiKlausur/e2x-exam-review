<div class="input-group">
  <input
    class="form-control"
    placeholder="yyyy-mm-dd"
    name="dp"
    ngbDatepicker
    #d="ngbDatepicker"
    [(ngModel)]="currentValue"
    (ngModelChange)="handleValueChange()"
    [class.is-invalid]="isInvalid"
  />
  <button class="btn btn-primary" (click)="d.toggle()" type="button"><i class="bi bi-calendar-event"></i></button>
</div>
