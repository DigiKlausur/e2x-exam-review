<select class="form-select" [(ngModel)]="currentValue" [class.is-invalid]="isInvalid" (ngModelChange)="handleValueChange()">
  <option selected disabled [ngValue]="undefined" i18n="@@app.input.dropdown.teaser">Please select</option>
  @for (option of semesterOptions; track $index){
    <option [ngValue]="option.value">{{option.title}}</option>
  }
</select>
