@if (answerSheet && file){
  <app-answer-sheet-viewer [answerSheet]="answerSheet" [file]="file" ></app-answer-sheet-viewer>
} @else {
  <div class="container mt-3">
    <ngb-alert class="alert-warning" [dismissible]="false" i18n="@@app.alert.answer-sheet-not-found">
      Answer sheet could not be found!
    </ngb-alert>
  </div>
}
