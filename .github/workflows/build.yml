name: build

env:
  CONTAINER_REGISTRY: ghcr.io
  CONTAINER_REGISTRY_USERNAME: ${{ github.actor }}
  CONTAINER_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN  }}
  FRONTEND_IMAGE_NAME: e2x-exam-review-frontend
  BACKEND_IMAGE_NAME: e2x-exam-review-backend

on:
  push:
    branches:
     - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'packages/backend/**'

  prepare-docker:
    name: Log in to container registries
    runs-on: ubuntu-latest
    steps:
      - name: Log in to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ env.CONTAINER_REGISTRY_PASSWORD  }}

  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.frontend == 'true' }}
    name: Build Backend
    runs-on: ubuntu-latest
    outputs:
      buildArtifactId: ${{ steps.artifact-upload.outputs.artifact-id }}
    defaults:
      run:
        working-directory: ./backend
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node Setup
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build OpenApi spec
        run: npm run openApi

      - name: Archive OpenApi Specification
        uses: actions/upload-artifact@v7
        with:
          name: backend-openApi-spec
          path: backend/openApi.json
          archive: false

      - name: Build Application
        run: npm run build

      - name: Archive Build Artifacts
        id: artifact-upload
        uses: actions/upload-artifact@v7
        with:
          name: backend-build-output
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/README.md

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CONTAINER_REGISTRY }}/${{ env.GITHUB_REPOSITORY_OWNER }}/${{ env.FRONTEND_IMAGE_NAME }}


      - name: Build Container Image
        id: frontend-image-build
        uses: docker/build-push-action@v7
        with:
          context: "./backend"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}



  build-frontend:
    needs:
      - changes
      - build-backend
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    strategy:
      matrix:
        node-version: [ 24.x ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node Setup
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Download Backend Build
        uses: actions/download-artifact@v8
        with:
          name: backend-build-output
          path: backend

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run ci:build

      - name: Archive Build Artifacts
        id: artifact-upload
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-output
          path: |
            frontend/dist
            frontend/index.html
            frontend/README.md
