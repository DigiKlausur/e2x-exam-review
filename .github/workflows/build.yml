name: build-frontend

on:
  push:
    branches:
     - main
  pull_request:
    branches:
      - '*'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'packages/backend/**'

  build-backend:
    needs: changes
    if: ${{ true || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.frontend == 'true' }}
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node Setup
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build OpenApi spec
        run: npm run openApi
        with:
          name: openApi-spec
          path: backend/openApi.json

      - name: Build Application
        run: npm run build
        with:
          name: build-output
          path: |
            dist
            package.json
            package-lock.json
            README.md

  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    strategy:
      matrix:
        node-version: [ 24.x ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node Setup
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run ci:build
