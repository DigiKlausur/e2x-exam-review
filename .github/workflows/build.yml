name: build-frontend

on:
  push:
    branches:
     - main
  pull_request:
    branches:
      - '*'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'packages/backend/**'

  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.frontend == 'true' }}
    name: Build Backend
    runs-on: ubuntu-latest
    outputs:
      buildArtifactId: ${{ steps.artifact-upload.outputs.artifact-id }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node Setup
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build OpenApi spec
        run: npm run openApi

      - name: Archive OpenApi Specification
        uses: actions/upload-artifact@v7
        with:
          name: backend-openApi-spec
          path: backend/openApi.json
          archive: false

      - name: Build Application
        run: npm run build

      - name: Archive Build Artifacts
        id: artifact-upload
        uses: actions/upload-artifact@v7
        with:
          name: backend-build-output
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/README.md

  build-frontend:
    needs:
      - changes
      - build-backend
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    strategy:
      matrix:
        node-version: [ 24.x ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node Setup
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Download Backend Build
        uses: actions/download-artifact@v8
        with:
          name: backend-build-output
          path: backend

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run ci:build

      - name: Archive Build Artifacts
        id: artifact-upload
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-output
          path: |
            frontend/dist/e2x-exam-review-frontend/browser/*
            frontend/dist/3rdpartylicenses.txt
            frontend/index.html
            frontend/README.md
